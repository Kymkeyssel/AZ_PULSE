name: az_pulse

services:

  # =========================================================
  # PostgreSQL
  # Base de données principale AZ PULSE
  # + base dédiée à n8n
  # =========================================================
  postgres:
    image: postgres:18.4
    container_name: azpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: azpulse
      POSTGRES_USER: azpulse
      POSTGRES_PASSWORD: azpulse_dev_password

      TZ: Africa/Douala
      PGTZ: Africa/Douala

    ports:
      - "5432:5432"

    volumes:
      - azpulse_postgres_data:/var/lib/postgresql
      # Le dossier sur le disque est `Docker/Postgres/init` (P majuscule).
      # Sous Linux, Docker distingue la casse : un chemin en minuscules
      # créait un dossier vide au lieu de monter les scripts d'init.
      - ./Postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U azpulse -d azpulse"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - azpulse


  # =========================================================
  # pgAdmin
  # Administration PostgreSQL
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: azpulse-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@azpulse.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"

      TZ: Africa/Douala

    ports:
      - "5050:80"

    volumes:
      - azpulse_pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - azpulse


  # =========================================================
  # Redis
  # Cache / données temporaires / support applicatif
  # =========================================================
  redis:
    image: redis:8.8.1-alpine
    container_name: azpulse-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - azpulse_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - azpulse


  # =========================================================
  # n8n
  # Moteur d'automatisation AZ PULSE
  # =========================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.7
    container_name: azpulse-n8n
    restart: unless-stopped

    environment:

      # -----------------------------------------------------
      # Général
      # -----------------------------------------------------
      TZ: Africa/Douala
      GENERIC_TIMEZONE: Africa/Douala

      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/

      N8N_SECURE_COOKIE: "false"

      # -----------------------------------------------------
      # Base PostgreSQL
      # -----------------------------------------------------
      DB_TYPE: postgresdb

      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432

      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: azpulse_n8n
      DB_POSTGRESDB_PASSWORD: n8n_dev_password

      # -----------------------------------------------------
      # Clé de chiffrement n8n
      # -----------------------------------------------------
      N8N_ENCRYPTION_KEY: azpulse_n8n_dev_encryption_key_change_me

      # -----------------------------------------------------
      # Désactivation de fonctionnalités inutiles en dev
      # -----------------------------------------------------
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

    ports:
      - "5678:5678"

    volumes:
      - azpulse_n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - azpulse


  # =========================================================
  # Mercure
  # Hub temps réel (SSE) pour notifications live, dashboard, CRM collaboratif
  # =========================================================
  mercure:
    image: dunglas/mercure:v0.16
    container_name: azpulse-mercure
    restart: unless-stopped

    environment:
      # Clés JWT (à changer en prod !)
      MERCURE_PUBLISHER_JWT_KEY: "azpulse_mercure_publisher_key_change_me_in_prod"
      MERCURE_SUBSCRIBER_JWT_KEY: "azpulse_mercure_subscriber_key_change_me_in_prod"

      # Config générale
      # "http://" force l'écoute en HTTP pur sur le port 80 (pas de TLS en dev)
      SERVER_NAME: "http://localhost"
      GLOBAL_OPTIONS: "auto_https off"
      MERCURE_ALLOW_ANONYMOUS: "1"
      MERCURE_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8000"
      MERCURE_PUBLISH_ALLOWED_ORIGINS: "http://localhost:8000"
      MERCURE_DEMO: "0"
      MERCURE_ADDR: ":80"
      MERCURE_LOG_LEVEL: "info"

    ports:
      - "8080:80"

    volumes:
      - azpulse_mercure_data:/data

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - azpulse

  # =========================================================
  # FastAPI (Service IA)
  # Orchestration des agents, OCR, NLP
  # =========================================================
  fastapi:
    build:
      context: ../Ai_Service
    container_name: azpulse-fastapi
    restart: unless-stopped
    environment:
      APP_ENV: development
      ACTIVE_PROVIDER: local
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
    ports:
      - "8001:8000"
    volumes:
      - ../Ai_Service:/app
    networks:
      - azpulse

# ===========================================================
# Volumes persistants
# ===========================================================
volumes:

  azpulse_postgres_data:
    name: azpulse_postgres_data

  azpulse_pgadmin_data:
    name: azpulse_pgadmin_data

  azpulse_redis_data:
    name: azpulse_redis_data

  azpulse_n8n_data:
    name: azpulse_n8n_data

  azpulse_mercure_data:
    name: azpulse_mercure_data


# ===========================================================
# Réseau interne
# ===========================================================
networks:

  azpulse:
    name: azpulse_network
    driver: bridge