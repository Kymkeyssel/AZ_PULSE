    code: |-
      // Horodatage : apparaît dans le nom des entités créées.
      if (!pm.collectionVariables.get('suffix') || pm.collectionVariables.get('suffix') === 'PM01') {
        pm.collectionVariables.set('suffix', 'PM' + String(Date.now()).slice(-5));
      }
