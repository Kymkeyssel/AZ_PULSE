$kind: http-request
description: Vérifie que l'intégration GLPI (source de vérité de l'inventaire) est joignable. Enregistre le premier `id` d'ordinateur dans `{{computerId}}` pour le test de détail 05.2.
url: "{{baseUrl}}/it/inventory/computers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — GLPI répond', () => pm.response.to.have.status(200));

      const json = pm.response.json();
      pm.test('la charge utile est un tableau', () => pm.expect(json.data).to.be.an('array'));
      pm.test('au moins un ordinateur retourné', () => pm.expect(json.data.length).to.be.above(0));
      pm.test('GLPI renvoie bien ses champs bruts (entities_id, name)', function () {
        pm.expect(json.data[0]).to.have.property('entities_id');
        pm.expect(json.data[0]).to.have.property('name');
      });

      pm.collectionVariables.set('computerId', json.data[0].id);
      console.log('💻 Premier ordinateur GLPI :', json.data[0].name);
    language: text/javascript
order: 2000
