$kind: http-request
name: 00.4 · ⚠️ DIAGNOSTIC Dashboard Workspace — même bug (attendu 500)
description: "Même cause racine que 00.3 : `DashboardController::workspace()` parcourt les tâches de chaque projet. **Un seul correctif débloque les deux endpoints** (ainsi que le test 03.3 « Lister les tâches d'un projet » et 03.4 « Passer une tâche à DONE »)."
url: "{{baseUrl}}/dashboard/workspace"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const status = pm.response.code;

      if (status === 200) {
        console.log('✅ Dashboard Workspace opérationnel.');
        pm.test('200 — statistiques workspace renvoyées', () => pm.response.to.have.status(200));
        pm.test('myOpenTasks est un nombre', () => pm.expect(pm.response.json().data.myOpenTasks).to.be.a('number'));
      } else {
        console.warn('❌ BUG CONFIRMÉ — HTTP ' + status + ' (TaskRepository manquante)');
        pm.test('BUG DOCUMENTÉ — TaskRepository manquante', () => {
          pm.expect(status).to.eql(500);
          pm.expect(pm.response.text()).to.include('TaskRepository');
        });
      }
    language: text/javascript
order: 4000
