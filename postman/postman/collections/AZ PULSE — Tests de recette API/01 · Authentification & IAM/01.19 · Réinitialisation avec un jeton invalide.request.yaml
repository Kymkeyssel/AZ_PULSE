$kind: http-request
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "jeton-fictif-inexistant",
      "password": "NouvelleMotDePasse2026!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 — jeton refusé', () => pm.response.to.have.status(400));
      pm.test('message explicite', () => pm.expect(pm.response.json().message).to.include('invalide'));

      pm.test('contrôle de robustesse — 8 caractères minimum', () => {
        pm.expect('Recette2026!'.length).to.be.above(8);
      });
    language: text/javascript
order: 19000
