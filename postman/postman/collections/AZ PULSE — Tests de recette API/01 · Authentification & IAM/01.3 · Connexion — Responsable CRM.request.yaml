$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{accountCrm}}",
      "password": "{{pwdCrm}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — connexion réussie', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('rôle = RESPONSABLE_CRM', () => pm.expect(j.user.primaryRole).to.eql('RESPONSABLE_CRM'));
      pm.test('aiguillage = /collaborateur/crm', () => pm.expect(j.user.interfaceRoute).to.eql('/collaborateur/crm'));
      pm.test('détient crm.manage (portefeuille complet)', () => pm.expect(j.user.permissions).to.include('crm.manage'));
      pm.test('ne détient PAS knowledge.write', () => pm.expect(j.user.permissions).to.not.include('knowledge.write'));


      pm.collectionVariables.set('tokenCrm', j.token);
      pm.environment.set('tokenCrm', j.token);
    language: text/javascript
order: 3000
