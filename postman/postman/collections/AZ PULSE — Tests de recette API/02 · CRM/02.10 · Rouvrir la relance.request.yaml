$kind: http-request
url: "{{baseUrl}}/reminders/{{reminderId}}/reopen"
method: POST
headers:
  Authorization: Bearer {{tokenCrm}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — relance rouverte', () => pm.response.to.have.status(200));
      pm.test('statut = PENDING', () => pm.expect(pm.response.json().data.status).to.eql('PENDING'));
      pm.test('l horodatage de clôture est effacé', () => pm.expect(pm.response.json().data.completedAt).to.be.null);
    language: text/javascript
order: 10000
