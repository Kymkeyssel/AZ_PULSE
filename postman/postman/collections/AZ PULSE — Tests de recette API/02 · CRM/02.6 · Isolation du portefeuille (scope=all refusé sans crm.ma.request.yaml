$kind: http-request
name: 02.6 · Isolation du portefeuille (scope=all refusé sans crm.manage)
url: "{{baseUrl}}/crm/pipeline?scope=all"
method: GET
headers:
  Authorization: Bearer {{tokenCrm}}
queryParams:
  scope: all
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — requête acceptée', () => pm.response.to.have.status(200));
      pm.test('le serveur rabat silencieusement sur « mine »', () => {
        pm.expect(pm.response.json().data.scope).to.eql('mine');
      });

      pm.test('sécurité — un commercial ne voit pas le carnet de ses collègues', () => {
        pm.expect(pm.response.json().data.scope).to.not.eql('all');
      });
      console.log('🔒 Périmètre cloisonné : un simple commercial ne peut pas élargir la vue.');
    language: text/javascript
order: 6000
