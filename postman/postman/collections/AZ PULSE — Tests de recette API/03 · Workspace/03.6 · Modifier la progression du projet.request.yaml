$kind: http-request
url: "{{baseUrl}}/workspace/projects/{{projectId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "progress": 65,
      "status": "ONGOING",
      "description": "Avancement à 65 % — phase de recette fonctionnelle."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — projet mis à jour', () => pm.response.to.have.status(200));
      pm.test('success = true', () => pm.expect(pm.response.json().success).to.be.true);

      console.log('📈 Progression du projet portée à 65 %.');
    language: text/javascript
order: 6000
