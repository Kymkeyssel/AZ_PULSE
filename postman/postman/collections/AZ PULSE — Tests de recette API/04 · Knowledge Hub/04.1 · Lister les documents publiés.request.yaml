$kind: http-request
description: |-
  Filtre appliqué côté serveur : **seuls les documents `PUBLISHED` sont visibles**, sauf si l'utilisateur détient `knowledge.read_all` (réservé au Super Admin et à l'Admin/Direction).

  C'est le mécanisme qui garantit qu'un brouillon ne fuite jamais vers un lecteur ordinaire.
url: "{{baseUrl}}/knowledge/documents"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — documents renvoyés', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('success = true', () => pm.expect(j.success).to.be.true);
      pm.test('data est un tableau', () => pm.expect(j.data).to.be.an('array'));

      pm.test('un compte authentifié voit au moins un document publié', () => pm.expect(j.data.length).to.be.above(0));
    language: text/javascript
order: 1000
