$kind: http-request
description: |-
  Proxy vers l'API REST de GLPI : ouverture de session (`App-Token` + `user_token`), requête, puis fermeture de session garantie par un `finally`.

  L'API renvoie les champs **bruts de GLPI** tels que : `id`, `entities_id`, `name`, `serial`, `otherserial`, `contact`, `date_mod`, `users_id_tech`…

  Exige `it.read`.
url: "{{baseUrl}}/it/inventory/computers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — inventaire renvoyé', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('data est un tableau', () => pm.expect(j.data).to.be.an('array'));
      pm.test('le parc contient au moins une machine', () => pm.expect(j.data.length).to.be.above(0));
      pm.test('les identifiants GLPI sont exploitables', () => {
        pm.expect(j.data[0].id).to.be.a('number');
        pm.expect(j.data[0].name).to.be.a('string');
      });

      console.log('💻 Parc GLPI :', j.data.length, 'machine(s) —', j.data[0].name);
    language: text/javascript
order: 1000
