$kind: http-request
url: "{{baseUrl}}/academy/courses"
method: GET
headers:
  Authorization: Bearer {{tokenApprenant}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — cours renvoyés', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('data est un tableau', () => pm.expect(j.data).to.be.an('array'));
      pm.test('au moins un module est défini', () => pm.expect(j.data.length).to.be.above(0));
      pm.test('chaque cours porte un titre', () => {
        j.data.forEach(c => pm.expect(c.title).to.be.a('string').and.not.empty);
      });
    language: text/javascript
order: 2000
