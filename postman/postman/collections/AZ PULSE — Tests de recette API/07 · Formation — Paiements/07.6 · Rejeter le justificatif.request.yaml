$kind: http-request
description: |-
  Le justificatif passe `REJECTED`. **Aucun effet sur l'échéancier** : ni tranche comptée, ni solde modifié — le contrôleur ne touche à `Tuition` que sur le chemin de la validation.

  Le motif n'est pas transporté par l'API : rien ne sera indiqué à l'apprenant sur la raison du refus.
url: "{{baseUrl}}/academy/payments/{{paymentIdReject}}/reject"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — justificatif rejeté', () => pm.response.to.have.status(200));
      pm.test('statut = REJECTED', () => pm.expect(pm.response.json().data.status).to.eql('REJECTED'));
    language: text/javascript
order: 6000
