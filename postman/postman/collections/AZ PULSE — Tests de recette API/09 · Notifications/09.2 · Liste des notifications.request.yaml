$kind: http-request
description: |-
  Pagination dans `meta` : `page`, `limit`, `total`, `pages` et `unreadCount`.

  Filtre `?unread=true` pour la file non lue.

  Chaque notification expose `id`, `type`, `title`, `body`, `link`, `severity`, `isRead`, `readAt`, `createdAt`.
url: "{{baseUrl}}/notifications?page=1&limit=20"
method: GET
queryParams:
  page: "1"
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — liste renvoyée', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('data est un tableau', () => pm.expect(j.data).to.be.an('array'));
      pm.test('blocage de pagination complet', () => {
        pm.expect(j.meta).to.include.all.keys('page', 'limit', 'total', 'pages', 'unreadCount');
      });
      pm.test('la page demandée est respectée', () => pm.expect(j.meta.page).to.eql(1));
      pm.test('total cohérent avec la page renvoyée', () => pm.expect(j.data.length).to.be.at.most(j.meta.total));
      pm.test('chaque notification est complète', () => {
        j.data.forEach(n => {
          pm.expect(n.id).to.be.a('number');
          pm.expect(n.type).to.be.a('string').and.not.empty;
          pm.expect(n.title).to.be.a('string').and.not.empty;
          pm.expect(n.severity).to.be.oneOf(['info', 'warning', 'critical']);
          pm.expect(n.isRead).to.be.a('boolean');
        });
      });

      if (j.data.length > 0) {
        pm.collectionVariables.set('notificationId', j.data[0].id);
      }
      console.log('📬', j.meta.total, 'notification(s),', j.meta.unreadCount, 'non lue(s).');
    language: text/javascript
order: 2000
