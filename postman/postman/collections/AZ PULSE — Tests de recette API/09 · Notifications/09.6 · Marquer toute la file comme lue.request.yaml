$kind: http-request
description: |-
  Le nombre **réellement** traité est renvoyé. Le bouton peut donc afficher une confirmation exacte plutôt que de laisser croire que des notifications disparues l'étaient déjà.

  `unreadCount` est forcé à `0` dans la réponse.
url: "{{baseUrl}}/notifications/read-all"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 — file traitée', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('updated est un entier', () => pm.expect(d.updated).to.be.a('number'));
      pm.test('le compteur est ramené à zéro', () => pm.expect(d.unreadCount).to.eql(0));
    language: text/javascript
order: 6000
